<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin | Monesh Ebooks</title>

<link rel="stylesheet" href="css/seller.css">

</head>

<body>

<div class="dashboard-layout">

<aside class="sidebar admin-sidebar">

    <div class="side-logo">
        Monesh <span>Admin</span>
    </div>

    <a href="admin.html" class="active">
        🛠 Dashboard
    </a>

    <a href="seller-dashboard.html">
        👤 Seller Area
    </a>

    <a href="index.html">
        🌐 Website
    </a>

</aside>


<main class="dashboard">

    <div class="dashboard-top">

        <div>
            <h1>Admin Dashboard</h1>

            <p>
                Manage sellers and ebook approvals.
            </p>
        </div>

    </div>


    <div class="stats-grid">

        <div class="stat-card">

            <span>👤</span>

            <h3 id="adminSellerCount">
                0
            </h3>

            <p>Sellers</p>

        </div>


        <div class="stat-card">

            <span>📚</span>

            <h3 id="adminBookCount">
                0
            </h3>

            <p>Books</p>

        </div>


        <div class="stat-card">

            <span>⏳</span>

            <h3 id="adminPendingCount">
                0
            </h3>

            <p>Pending Approval</p>

        </div>

    </div>


    <section class="dashboard-section">

        <h2>Book Approval</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Book</th>
                        <th>Seller</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="adminBooksTable">

                </tbody>

            </table>

        </div>

    </section>

</main>

</div>

<script src="js/seller.js"></script>

</body>
</html>
