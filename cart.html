<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart — Monesh Ebooks</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<header class="header">

    <a
        href="index.html"
        class="brand"
    >
        <span class="brand-mark">M</span>
        MONESH EBOOKS
    </a>

    <nav class="nav">

        <a href="index.html">
            Home
        </a>

        <a href="books.html">
            Books
        </a>

        <a href="library.html">
            My Library
        </a>

    </nav>

</header>


<main class="page">

<div class="container">

    <p class="kicker">
        YOUR CART
    </p>

    <h1>
        Shopping cart.
    </h1>

    <div id="cartContainer"></div>

</div>

</main>


<!-- Website data -->
<script src="js/data.js"></script>

<!-- Coupon configuration -->
<script src="js/rewards-config.js"></script>

<!-- Main app -->
<script src="js/app.js"></script>


<script>

const cart = getCart();

const container =
    document.getElementById("cartContainer");


/* =========================================================
   EMPTY CART
========================================================= */

if (cart.length === 0) {

    container.innerHTML = `

        <div class="empty">

            <h2>
                Your cart is empty.
            </h2>

            <br>

            <a
                href="books.html"
                class="btn btn-dark"
            >
                Browse Books
            </a>

        </div>

    `;

}


/* =========================================================
   CART
========================================================= */

else {

    let total = 0;

    let html = "";


    cart.forEach(id => {

        const book = getBook(id);

        if (!book) return;


        total += Number(book.price);


        html += `

            <div class="cart-item">

                <img
                    src="${book.cover}"
                    alt="${book.title}"
                >

                <div>

                    <h3>
                        ${book.title}
                    </h3>

                    <p>
                        ${book.author}
                    </p>

                    <br>

                    <strong>
                        ₹${book.price}
                    </strong>

                    <br><br>

                    <button
                        onclick="removeFromCart(${book.id})"
                    >
                        Remove
                    </button>

                </div>

            </div>

        `;

    });


    /* =====================================================
       CART TOTAL + COUPON
    ===================================================== */

    html += `

        <div class="cart-total">

            <h2>
                Total:
                ₹<span id="cartTotal">
                    ${total}
                </span>
            </h2>


            <div class="coupon-area">

                <p class="coupon-label">
                    SUBSCRIBER COUPON
                </p>


                <div class="coupon-row">

                    <input
                        id="couponInput"
                        type="text"
                        placeholder="Enter coupon code"
                        autocomplete="off"
                        maxlength="30"
                    >

                    <button
                        id="couponApply"
                        type="button"
                    >
                        Apply
                    </button>

                </div>


                <div
                    id="couponMessage"
                    class="coupon-message"
                ></div>


                <a
                    id="checkoutLink"
                    href="payment.html?id=${encodeURIComponent(cart[0])}"
                    class="btn btn-dark"
                >
                    Checkout →
                </a>

            </div>

        </div>

    `;


    container.innerHTML = html;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const couponInput =
        document.getElementById("couponInput");

    const couponApply =
        document.getElementById("couponApply");

    const couponMessage =
        document.getElementById("couponMessage");

    const cartTotal =
        document.getElementById("cartTotal");

    const checkoutLink =
        document.getElementById("checkoutLink");


    /* =====================================================
       ORIGINAL TOTAL
    ===================================================== */

    const originalTotal = total;


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showCouponMessage(
        text,
        ok = false
    ) {

        couponMessage.textContent = text;

        couponMessage.className =
            "coupon-message" +
            (ok ? " ok" : " error");

    }


    /* =====================================================
       CHECKOUT LINK
    ===================================================== */

    function setCheckoutCoupon(code) {

        checkoutLink.href =
            "payment.html?id=" +
            encodeURIComponent(cart[0]) +
            "&coupon=" +
            encodeURIComponent(code);

    }


    /* =====================================================
       GOOGLE APPS SCRIPT JSONP
    ===================================================== */

    function checkCoupon(coupon) {

        return new Promise(
            (resolve, reject) => {

                const cfg =
                    window.MONESH_REWARD_CONFIG || {};


                const callbackName =
                    "couponCallback_" +
                    Date.now() +
                    "_" +
                    Math.floor(
                        Math.random() * 100000
                    );


                const script =
                    document.createElement("script");


                let finished = false;


                const timeout =
                    setTimeout(() => {

                        if (finished) return;

                        finished = true;

                        cleanup();

                        reject(
                            new Error(
                                "Coupon request timed out."
                            )
                        );

                    }, 15000);


                function cleanup() {

                    clearTimeout(timeout);


                    if (
                        script &&
                        script.parentNode
                    ) {

                        script.parentNode.removeChild(
                            script
                        );

                    }


                    try {

                        delete window[
                            callbackName
                        ];

                    } catch (error) {

                        window[
                            callbackName
                        ] = undefined;

                    }

                }


                window[callbackName] =
                    function(data) {

                        if (finished) return;

                        finished = true;

                        cleanup();

                        resolve(data);

                    };


                script.onerror =
                    function() {

                        if (finished) return;

                        finished = true;

                        cleanup();

                        reject(
                            new Error(
                                "Could not connect to coupon server."
                            )
                        );

                    };


                const url =
                    cfg.APPS_SCRIPT_URL +
                    "?action=validateCoupon" +
                    "&coupon=" +
                    encodeURIComponent(coupon) +
                    "&callback=" +
                    encodeURIComponent(callbackName) +
                    "&_=" +
                    Date.now();


                script.src = url;


                document.body.appendChild(
                    script
                );

            }
        );

    }


    /* =====================================================
       APPLY COUPON
    ===================================================== */

    couponApply.addEventListener(
        "click",
        async function() {

            const code =
                couponInput.value
                    .trim()
                    .toUpperCase();


            /* Empty */

            if (!code) {

                showCouponMessage(
                    "Enter your subscriber coupon."
                );

                return;

            }


            /* Configuration */

            const cfg =
                window.MONESH_REWARD_CONFIG || {};


            if (
                !cfg.APPS_SCRIPT_URL ||
                cfg.APPS_SCRIPT_URL.includes(
                    "PASTE_"
                ) ||
                cfg.APPS_SCRIPT_URL.includes(
                    "YOUR_"
                )
            ) {

                showCouponMessage(
                    "Reward system is not configured yet."
                );

                return;

            }


            /* Disable button */

            couponApply.disabled = true;

            couponApply.textContent =
                "Checking...";


            showCouponMessage(
                "Checking coupon..."
            );


            try {

                const data =
                    await checkCoupon(code);


                console.log(
                    "Coupon server response:",
                    data
                );


                /* Server error */

                if (!data || !data.success) {

                    showCouponMessage(
                        data &&
                        data.message
                            ? data.message
                            : "Coupon server error."
                    );

                    return;

                }


                /* Invalid */

                if (!data.valid) {

                    showCouponMessage(
                        data.message ||
                        "Invalid coupon."
                    );

                    return;

                }


                /* Discount */

                const discount =
                    Number(data.discount) || 0;


                const discounted =
                    Math.max(
                        0,
                        originalTotal -
                        (
                            originalTotal *
                            discount /
                            100
                        )
                    );


                /* Update total */

                cartTotal.textContent =
                    discounted
                        .toFixed(2)
                        .replace(
                            /\.00$/,
                            ""
                        );


                /* Success */

                showCouponMessage(
                    discount +
                    "% discount applied ✓",
                    true
                );


                /* Update checkout */

                const validCoupon =
                    data.coupon || code;


                setCheckoutCoupon(
                    validCoupon
                );


                /* Save coupon */

                localStorage.setItem(
                    "moneshAppliedCoupon",
                    validCoupon
                );


                /* Remember subscriber coupon */

                localStorage.setItem(
                    "moneshSubscriberCoupon",
                    validCoupon
                );


                /* Prevent changing after success */

                couponInput.value =
                    validCoupon;


                couponInput.disabled =
                    true;


                couponApply.disabled =
                    true;


                couponApply.textContent =
                    "Applied ✓";


                couponApply.style.opacity =
                    "0.7";


            } catch (error) {

                console.error(
                    "Coupon error:",
                    error
                );


                showCouponMessage(
                    "Could not check the coupon server."
                );

            } finally {

                if (
                    !couponInput.disabled
                ) {

                    couponApply.disabled =
                        false;

                    couponApply.textContent =
                        "Apply";

                }

            }

        }
    );


    /* =====================================================
       LOAD SAVED COUPON
    ===================================================== */

    const savedCoupon =
        localStorage.getItem(
            "moneshSubscriberCoupon"
        );


    const appliedCoupon =
        localStorage.getItem(
            "moneshAppliedCoupon"
        );


    if (appliedCoupon) {

        couponInput.value =
            appliedCoupon;

    }

    else if (savedCoupon) {

        couponInput.value =
            savedCoupon;

    }

}


/* =========================================================
   COUPON CSS
========================================================= */

</script>


<style>

.coupon-area {

    margin-top: 25px;

    text-align: left;

    max-width: 520px;

    margin-left: auto;

}


.coupon-label {

    font-size: 11px;

    letter-spacing: 2px;

    font-weight: 800;

    color: #777;

    margin-bottom: 8px;

}


.coupon-row {

    display: flex;

    gap: 8px;

}


.coupon-row input {

    flex: 1;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 7px;

    text-transform: uppercase;

    font-size: 14px;

    outline: none;

}


.coupon-row input:focus {

    border-color: #171717;

}


.coupon-row button {

    padding: 13px 18px;

    border: 0;

    border-radius: 7px;

    background: #171717;

    color: #fff;

    font-weight: 700;

    cursor: pointer;

}


.coupon-row button:hover {

    opacity: 0.9;

}


.coupon-row button:disabled {

    cursor: not-allowed;

}


.coupon-message {

    font-size: 13px;

    margin: 10px 0 14px;

    min-height: 18px;

}


.coupon-message.ok {

    color: #087f45;

}


.coupon-message.error {

    color: #a52a2a;

}


@media (max-width: 500px) {

    .coupon-row {

        display: grid;

        grid-template-columns: 1fr;

    }


    .coupon-row button {

        width: 100%;

    }

}

</style>


</body>

</html>
