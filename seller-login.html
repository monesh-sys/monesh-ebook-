<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Login | Monesh Ebooks</title>

    <link rel="stylesheet" href="css/seller.css">

</head>

<body>

<header class="seller-header">

    <a href="index.html" class="logo">
        Monesh <span>Ebooks</span>
    </a>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">🔐</div>

        <h1>Seller Login</h1>

        <p>Login to manage your ebooks and sales.</p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Seller email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >


            <button
                type="submit"
                class="btn primary"
            >
                Login
            </button>

        </form>

        <div id="loginMessage"></div>

        <p class="auth-bottom">
            Don't have an account?
            <a href="seller-register.html">
                Become a Seller
            </a>
        </p>

    </div>

</main>

<script src="js/seller.js"></script>

</body>
</html>
