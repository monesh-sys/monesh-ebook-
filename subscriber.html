<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tech Blueprint Reward | Monesh Ebooks</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    .reward-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .reward-card {
      width: min(550px, 100%);
      padding: 45px 30px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 20px 70px rgba(0,0,0,.12);
      text-align: center;
    }

    .reward-logo {
      width: 75px;
      height: 75px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: #111;
      color: white;
      font-size: 30px;
      font-weight: 900;
    }

    .reward-card h1 {
      margin-top: 25px;
      font-size: 38px;
    }

    .reward-card p {
      color: #666;
      line-height: 1.7;
    }

    .reward-step {
      margin: 25px 0;
    }

    .reward-step input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .reward-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .reward-btn:hover {
      opacity: .88;
    }

    .coupon-code {
      display: none;
      margin: 20px 0;
      padding: 18px;
      border: 2px dashed #111;
      border-radius: 15px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .coupon-success {
      color: #16803c;
      margin-top: 15px;
    }

    .coupon-error {
      color: #c62828;
      margin-top: 15px;
    }

    .small-note {
      font-size: 13px;
      color: #888;
      margin-top: 20px;
    }

  </style>

</head>


<body>

  <main class="reward-page">

    <section class="reward-card">

      <div class="reward-logo">
        M
      </div>

      <h1>
        Get 50% OFF
      </h1>

      <p>
        Subscribe to Tech Blueprint on YouTube
        and claim your special Monesh Ebooks coupon.
      </p>


      <div class="reward-step">

        <button
          id="subscribeYoutube"
          class="reward-btn"
        >
          Subscribe to Tech Blueprint
        </button>

      </div>


      <div class="reward-step">

        <input
          id="subscriberEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
        >

        <button
          id="getCoupon"
          class="reward-btn"
        >
          Get My Coupon
        </button>

      </div>


      <div
        id="couponBox"
        class="coupon-code"
      ></div>


      <div
        id="couponResult"
      ></div>


      <p class="small-note">
        One coupon per email. Coupon can be used once.
      </p>

    </section>

  </main>


  <script src="js/subscriber.js"></script>

</body>

</html>
